# environment.yml
name: peat_fire_stanback
channels:
  - conda-forge
dependencies:
  - python=3.11
  - geopandas
  - pyogrio
  - pyproj
  - shapely
  - fiona
  - rasterio
  - rioxarray
  - xarray
  - libgdal-hdf4   # <-- required to read MODIS MCD64A1 HDF4 files
  - earthaccess
  - python-dotenv
  - pandas
  - numpy
  - matplotlib   # <-- plotting (time series, heatmaps, overlay maps)
  - statsmodels  # <-- GLM / GLMM fits for the modeling pipeline
  - scikit-learn # <-- nearest-neighbour control matching, scaling
  - jupyterlab
  - ipykernel
  - pip
  - pip:
      - pymatch      # <-- propensity-score control matching (pip-only); optional
      - differences  # <-- Callaway-Sant'Anna staggered DiD (modeling/did.py); optional